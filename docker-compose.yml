services:
  db:
    image: postgres:17
    container_name: jobmatch-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: jobmatch-api
    ports:
      - "8000:8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      python -c 'from app.database import Base, engine; from app.models.offer import Offer; Base.metadata.create_all(bind=engine)' &&
      fastapi run app/main.py --host 0.0.0.0 --port 8000
      "

volumes:
  postgres_data: