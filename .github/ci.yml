name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobmatch_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: jobmatch_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobmatch_user -d jobmatch_ai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: jobmatch_user
      DB_PASSWORD: test_password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: jobmatch_ai

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest